# Rerun safety, nightly.
#
# ## The blind spot this closes
#
# Every other job in this repo runs on a FRESH CLONE. That makes CI structurally
# incapable of seeing a whole class of defect: a suite that pollutes its own
# working tree and therefore passes exactly once. CI always runs pass #1, so it
# is always green; only a human or an agent running the suite twice in one
# checkout ever sees the failure.
#
# #4065 was exactly that. `InMemoryDriver` defaulted to `persistence: 'auto'`,
# which on Node means a file adapter — so a suite seeding two rows with fixed
# ids wrote them to `.objectstack/data/memory-driver.json`, and the next run
# loaded them back and asserted four. Run N read 2N rows. It sat in the repo
# green through every CI run it ever had, and surfaced only because someone ran
# the full suite a second time in the same tree while doing unrelated work — at
# which point it looked like their own change had broken something.
#
# This job runs the full suite TWICE in one checkout. The first pass is allowed
# to fail loudly like any other; what this gate is really asserting is that the
# SECOND pass agrees with the first.
#
# ## Why pass 1 no longer ends the job (#18590)
#
# That last sentence was true of the design and false of the implementation. A
# red `pass 1` ENDED THE JOB, which skipped `pass 2` — so on every night the
# suite was red on main, the one thing this workflow exists to assert was not
# asserted. The job went red anyway, and its red is indistinguishable from the
# red it exists to report.
#
# It ran that way for a 17-night streak ending 2026-08-31: thirteen of those
# nights died in pass 1, under FOUR different failing packages and two different
# failure kinds, with the killer moving from `verify` to `cli` as each was
# fixed. Only four of the seventeen nights ever reached pass 2. "Keep pass 1
# green" is not a reachable end state on a trunk that goes red like any other,
# so the measurement is no longer conditional on it: both passes always run,
# and `scripts/rerun-safety-verdict.mjs` compares their failing task sets and
# says, in one line, whether the rerun property was MEASURED and what it said.
#
# ⛔ Nothing here is weakened. A red pass 1 still fails this job. What changed
# is only that a broken trunk now costs the instrument its BASELINE instead of
# its READING.
#
# ## Why `--force`
#
# Turbo would replay cached results on the second pass and report green without
# executing anything, which is precisely the wrong answer here. `--force`
# bypasses the cache so the second pass genuinely re-runs.
#
# ## Why `--only` (#23880)
#
# `--force` applies to every task in the run, and `test` depends on `^build`, so
# each pass also re-executed the whole build closure -- 69 `build` tasks and
# `@objectstack/spec#gen:migration-registry` (`turbo run test --dry=json` at
# 98ba1bf1d2) -- that `Build packages` had just built. `--only` runs the 83 `test`
# tasks and nothing they depend on; all 69 of those builds are in `pnpm build`'s
# own plan, and the spec's `test` script regenerates its migration registry
# itself. It also stops pass 2 from rebuilding `dist/` over whatever pass 1 left
# there, which is a working-tree state this job exists to see, not to repair.
#
# ## Why four legs (#23880, the maintainer's ruling A)
#
# One runner stopped holding two full passes. On 2026-10-17 (run 39001012611)
# setup and build took 6.7 minutes, pass 1 took 110.5 and pass 2 was stopped by
# its time share 47 minutes in: INCOMPLETE, the rerun property NOT MEASURED, for
# the sixth night running. Pass 1 alone needs more than the 79 minutes a pass can
# have here ((170 - 6.7 - 5) / 2), and raising the 170-minute bound is ruled out.
#
# So the job is a matrix of LEGS. Each leg is its own runner and its own
# checkout, and runs the whole instrument over its own package set: install,
# build, pass 1, the on-disk report, pass 2 in the same tree, and a verdict that
# names the leg. The split:
#
#   dogfood        @objectstack/dogfood, alone
#   cli            @objectstack/cli, alone (2205.79 s of measured task time in
#                  scripts/test-shard-timings.json, the heaviest package)
#   rest-K-of-2    every other workspace package, split in two by
#                  scripts/partition-test-shards.mjs from that dataset -- the
#                  partitioner and call shape Test Core uses, with the two
#                  whole-package legs excluded
#
# Estimated per pass at that dataset (bd4276a91): rest 1 and rest 2 each carry
# about 4717 s of task time, so at --concurrency=4 a pass is bounded by about 36
# and 28 minutes (sum / 4 + 3/4 of the heaviest task), and 58 and 45 minutes when
# every task runs as slowly as the slowest one the 10-17 log shows (pass 2's
# metadata-protocol, 1.59x its weight); cli is 37 minutes, 58 at 1.59x; dogfood's
# three CI shards ran 15.3 minutes in all. Each fits under 79 with the reserve.
#
# ⛔ The plan step below refuses a matrix that does not put EVERY workspace
# package's `test` task in exactly one leg -- a package in no leg is coverage
# this instrument silently stopped taking, and a package in two is a reading
# taken twice under two names.
#
# ⚠ THE ACCEPTED COST, stated in the ruling: a test in one leg that leaves state a
# test in ANOTHER leg reads is no longer measured -- the two never share a tree.
# A suite that pollutes its own package's tree, the #4065 class, still is. And
# each leg pays its own setup and build, about three extra laps a night.
name: Rerun Safety

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC nightly — an hour before Spec Coverage

permissions:
  contents: read

jobs:
  rerun-safety:
    name: Full suite twice in one working tree (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      # ⛔ Every leg runs to its own verdict. A red leg is a reading about ITS
      # packages; cancelling the other legs on it would turn their readings into
      # NOT MEASURED for a reason that has nothing to do with them.
      fail-fast: false
      # A whole-package leg names its `package`; a rest leg names its `shard` of
      # the partition. RERUN_WHOLE_PACKAGE_LEGS and RERUN_REST_LEG_COUNT below
      # must agree with this list, and the plan step refuses when they do not.
      matrix:
        include:
          - leg: dogfood
            package: '@objectstack/dogfood'
          - leg: cli
            package: '@objectstack/cli'
          - leg: rest-1-of-2
            shard: '1/2'
          - leg: rest-2-of-2
            shard: '2/2'
    # Two full passes of THIS LEG's packages. Generous, but bounded —
    # an unbounded job is what let a hung Test Core sit for GitHub's 6h default
    # while the PR read as "still running" rather than broken. Since #4314 the
    # primary stall detector is run-with-stall-guard on each pass (labeled red
    # after 15 min of frozen output); this is the pure backstop.
    #
    # ⚠️ Raised 120 -> 170 (#18590). 120 had stopped being a backstop and become
    # a second way for this instrument to go dark: the last four GREEN two-pass
    # runs on main took 74, 89, 103 and **115** minutes, so a healthy run was
    # within five minutes of being killed by its own bound — and #18590 makes
    # pass 2 run on the nights pass 1 is red too, which is exactly when a
    # 115-minute run is most likely. ⛔ This is NOT a stall budget and must never
    # be read as one: run-with-stall-guard still declares a stall after 15
    # minutes of frozen output on EITHER pass, so a genuine hang is still caught
    # in 15 minutes and never at this number. Raising it can therefore hide no
    # hang; all it stops is a slow-but-live run being reported as a failure of
    # the thing under test.
    #
    # ⚠️ 170 no longer holds two full passes, and raising it again is not the
    # fix (#23880). Measured from the job's own step timestamps: pass 1 took 38
    # minutes on 2026-09-26 (the last green night), 66 on 10-02, and 97-113 on
    # every night from 10-12 to 10-16, while the queue-tier suite's measured
    # task time (scripts/test-shard-timings.json) grew from 124 to 194 minutes
    # between the 09-28 and 10-13 refreshes, the CLI's alone from 733 to 2206
    # seconds. Not a hang: on 10-16 pass 2 was still printing when the job
    # timeout cancelled it 67 minutes in. A night finished at all only because
    # pass 2 stopped at its first failure; one that did not fail was CANCELLED,
    # with no verdict and a conclusion the red-card filer does not read.
    #
    # So each pass now runs under the time the job has LEFT (JOB_TIMEOUT_MINUTES
    # below, which must equal this number, minus PASS_RESERVE_MINUTES for the
    # verdict), and a pass that runs out is stopped by `timeout` instead: the
    # verdict step still runs, reads the pass's 124/137 exit (or a log with no
    # turbo summary) as INCOMPLETE -- NOT MEASURED, and the job concludes
    # `failure`, never a silent `cancelled`. That bound decides only WHO reports
    # a slow night. How two passes fit again was the capacity decision on
    # #23880, and its answer is the legs (see "Why four legs" above): the bound
    # is unchanged and now applies to each leg's own job.
    timeout-minutes: 170
    env:
      JOB_TIMEOUT_MINUTES: 170
      # The verdict and the steps after it take seconds; the reserve also covers
      # `timeout --kill-after=2m`, the grace a pass gets between SIGTERM and SIGKILL.
      PASS_RESERVE_MINUTES: 5
      # The leg this job is: printed by the verdict, and in the job's name.
      RERUN_LEG: ${{ matrix.leg }}
      # The packages that are a leg of their own, and how many rest legs share
      # everything else. Every rest leg excludes every whole-package leg from
      # the partition, so these two values and the matrix above are one plan.
      RERUN_WHOLE_PACKAGE_LEGS: '@objectstack/dogfood @objectstack/cli'
      RERUN_REST_LEG_COUNT: 2
    steps:
      - name: Record the job's deadline
        run: echo "JOB_DEADLINE_EPOCH=$(( $(date +%s) + JOB_TIMEOUT_MINUTES * 60 ))" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # Restore-only: scheduled runs read main's store cache; the per-push
      # workflows own saving it.
      - name: Restore pnpm cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-v3-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v3-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # THIS LEG'S PACKAGES, and the proof that the legs together are the whole
      # workspace. Every leg computes the FULL plan -- the whole-package legs plus
      # every rest leg's share, from the same `turbo ls` and the same timings --
      # and refuses unless each workspace package is in exactly one leg. That is
      # cheap (the partitioner reads two JSON files) and it is the only place the
      # matrix, the two env values above and the partitioner meet, so a leg
      # added to one and not the others is red here, not a package quietly
      # tested by nobody.
      #
      # The rest legs call the partitioner exactly as Test Core does (ci.yml,
      # "Compute this shard's package set"): `turbo ls --output=json`, then
      # `--shard K/N` with `--exclude` for each package that runs elsewhere. The
      # list is always the FULL one -- this workflow runs only on `schedule` and
      # `workflow_dispatch`, which is the event select-shard-packages.sh answers
      # with the full list too.
      #
      # ⛔ An item with a space is a file-level SLICE (`<package> k/n`). A leg
      # cannot run one -- a slice reaches vitest only through OS_TEST_SHARD,
      # which these passes do not set -- so it is refused rather than handed to
      # `--filter`, where it would select nothing. Today's map slices only the
      # CLI, which is a leg of its own.
      #
      # Before `Build packages`, on purpose: a red build still lets pass 2 and
      # the verdict run, exactly as before the legs, because both read this
      # step's outcome rather than the build's.
      - name: Compute this leg's package set
        id: plan
        env:
          LEG_PACKAGE: ${{ matrix.package }}
          LEG_SHARD: ${{ matrix.shard }}
          LEG_TOTAL: ${{ strategy.job-total }}
        run: |
          set -o pipefail
          export LC_ALL=C
          read -r -a WHOLE <<< "$RERUN_WHOLE_PACKAGE_LEGS"
          if [ "$LEG_TOTAL" -ne $(( ${#WHOLE[@]} + RERUN_REST_LEG_COUNT )) ]; then
            echo "::error::The matrix runs $LEG_TOTAL legs, but RERUN_WHOLE_PACKAGE_LEGS names ${#WHOLE[@]} package(s) and RERUN_REST_LEG_COUNT is $RERUN_REST_LEG_COUNT. Change the three together."
            exit 1
          fi
          EXCLUDES=()
          for PKG in "${WHOLE[@]}"; do EXCLUDES+=(--exclude "$PKG"); done

          pnpm exec turbo ls --output=json > "$RUNNER_TEMP/turbo-ls.json"
          printf '%s\n' "${WHOLE[@]}" > "$RUNNER_TEMP/leg-plan.txt"
          for K in $(seq 1 "$RERUN_REST_LEG_COUNT"); do
            node scripts/partition-test-shards.mjs "$RUNNER_TEMP/turbo-ls.json" \
              --shard "$K/$RERUN_REST_LEG_COUNT" "${EXCLUDES[@]}" \
              > "$RUNNER_TEMP/leg-rest-$K.txt"
            cat "$RUNNER_TEMP/leg-rest-$K.txt" >> "$RUNNER_TEMP/leg-plan.txt"
          done

          if grep -n ' ' "$RUNNER_TEMP/leg-plan.txt"; then
            echo "::error::The partition handed a rest leg a file-level slice (above). A leg runs whole packages only: stop slicing that package for this run, or give it a leg of its own."
            exit 1
          fi
          jq -r '.packages.items[].name' "$RUNNER_TEMP/turbo-ls.json" | sort > "$RUNNER_TEMP/leg-workspace.txt"
          sort "$RUNNER_TEMP/leg-plan.txt" > "$RUNNER_TEMP/leg-plan.sorted.txt"
          TWICE="$(uniq -d "$RUNNER_TEMP/leg-plan.sorted.txt")"
          NOWHERE="$(comm -23 "$RUNNER_TEMP/leg-workspace.txt" <(uniq "$RUNNER_TEMP/leg-plan.sorted.txt"))"
          UNKNOWN="$(comm -13 "$RUNNER_TEMP/leg-workspace.txt" <(uniq "$RUNNER_TEMP/leg-plan.sorted.txt"))"
          if [ -n "$TWICE$NOWHERE$UNKNOWN" ]; then
            [ -z "$TWICE" ] || echo "::error::In more than one leg: ${TWICE//$'\n'/ }"
            [ -z "$NOWHERE" ] || echo "::error::In no leg, so never run twice: ${NOWHERE//$'\n'/ }"
            [ -z "$UNKNOWN" ] || echo "::error::Not a workspace package: ${UNKNOWN//$'\n'/ }"
            exit 1
          fi
          echo "Plan: $(wc -l < "$RUNNER_TEMP/leg-workspace.txt") workspace packages, each in exactly one of $LEG_TOTAL legs."

          if [ -n "$LEG_PACKAGE" ]; then
            if ! printf '%s\n' "${WHOLE[@]}" | grep -qxF -- "$LEG_PACKAGE"; then
              echo "::error::Leg $RERUN_LEG runs $LEG_PACKAGE, which RERUN_WHOLE_PACKAGE_LEGS does not name, so the rest legs would run it too."
              exit 1
            fi
            echo "$LEG_PACKAGE" > "$RUNNER_TEMP/leg-packages.txt"
          else
            K="${LEG_SHARD%/*}"
            if [ "$LEG_SHARD" != "$K/$RERUN_REST_LEG_COUNT" ] || [ ! -f "$RUNNER_TEMP/leg-rest-$K.txt" ]; then
              echo "::error::Leg $RERUN_LEG names shard '$LEG_SHARD', which is not one of the $RERUN_REST_LEG_COUNT rest legs."
              exit 1
            fi
            cp "$RUNNER_TEMP/leg-rest-$K.txt" "$RUNNER_TEMP/leg-packages.txt"
          fi
          # ⛔ Never an empty set: `turbo run test` with no --filter runs the whole workspace.
          if [ ! -s "$RUNNER_TEMP/leg-packages.txt" ]; then
            echo "::error::Leg $RERUN_LEG has no packages."
            exit 1
          fi
          echo "Leg $RERUN_LEG runs the test task of these $(wc -l < "$RUNNER_TEMP/leg-packages.txt") package(s), twice:"
          cat "$RUNNER_TEMP/leg-packages.txt"

      - name: Build packages
        run: pnpm build

      # ⭐ Pass 1 RECORDS its exit code instead of ending the job with it
      # (#18590), and that change is what makes this workflow an instrument
      # again rather than a light that has been on for seventeen nights.
      #
      # It used to be spelled "deliberately NOT `continue-on-error`", on the
      # reasoning that a red pass 1 means the suite is broken on main and that
      # is worth failing on. The reasoning still holds and the job still fails
      # — see the verdict step, which owns the exit status now. What did NOT
      # hold is the consequence nobody wrote down: a step that ends the job also
      # skips `pass 2`, so on every night pass 1 was red the ONE measurement
      # this workflow exists to take was not taken at all. The job went red
      # either way, and that red is indistinguishable from the red it exists to
      # report — "rerun safety is failing" and "rerun safety was never measured"
      # printed the same colour.
      #
      # Measured over the 17-night red streak that ended 2026-08-31 (#18590):
      # thirteen nights died here in pass 1, and the killer MOVED — six nights
      # `@objectstack/verify#test` (an AssertionError, since fixed on main),
      # then four nights `@objectstack/cli#test` (5000ms vitest timeouts), with
      # `plugin-auth` and earlier `cli` nights in between. The remaining four
      # nights reached pass 2 and are the only rerun readings the streak
      # contains. So "keep pass 1 green" was never a reachable end state on a
      # trunk that is red from time to time like any other — and every night it
      # was not reached cost the reading.
      #
      # The stall guard (#4250, #4314) is unchanged: it bounds a frozen-output
      # hang at 15 min instead of letting a nightly nobody watches sit to the
      # job timeout; on a stall it exits 75 and its banner names the last output
      # line. --log-order=stream is mandatory under the guard (see the Test Core
      # comment in ci.yml): grouped log order flushes a task's output only when
      # the task ends, so a solo tail task longer than the budget reads as
      # frozen while healthy. The guard refuses a turbo run without it.
      #
      # The time bound (#23880) sits INSIDE the guard, as the command it wraps:
      # the guard runs that command in its own process group, so `timeout` is
      # that group's leader and its SIGTERM reaches turbo, which stops its tasks.
      # Measured locally at 98ba1bf1d2 (guard -> timeout 45s -> turbo over core,
      # types and formula): exit 124 came back through the guard, and the log
      # ended at "Shutting down Turborepo tasks..." / "Force killed Turborepo
      # tasks: @objectstack/core#test" with no `Tasks:` summary. The verdict reads
      # 124 (or 137, after --kill-after) as a pass that did not finish. Wrapped
      # the other way round, `timeout` would kill only the guard and leave its
      # detached group running into the next step.
      - name: Test suite — pass 1
        run: |
          # Bound vitest's INNER worker pool (#11958). A no-op on a runner with
          # <= 5 cores (it only ever LOWERS vitest's own `cores - 1` default);
          # it exists so a larger runner cannot multiply turbo's outer
          # --concurrency by a host-sized inner pool. Empty on failure, which is
          # vitest's own "use the default" signal. Needs turbo.json's
          # globalPassThroughEnv entry or turbo strips it — see the script header.
          export VITEST_MAX_WORKERS="$(node scripts/vitest-worker-cap.mjs)"
          # This leg's packages, one `--filter` each (the plan step refused an
          # empty set, so this can never be a whole-workspace run).
          mapfile -t PKGS < "$RUNNER_TEMP/leg-packages.txt"
          FILTERS=("${PKGS[@]/#/--filter=}")
          budget=$(( (JOB_DEADLINE_EPOCH - $(date +%s)) / 60 - PASS_RESERVE_MINUTES ))
          echo "Pass 1 of leg ${RERUN_LEG} may run ${budget} minutes before the job's own timeout would end it."
          status=0
          if [ "$budget" -lt 1 ]; then
            : > "$RUNNER_TEMP/rerun-pass1.log"
            status=124
          else
            node scripts/run-with-stall-guard.mjs --log "$RUNNER_TEMP/rerun-pass1.log" --stall-minutes 15 -- \
              timeout --kill-after=2m "${budget}m" \
              pnpm turbo run test "${FILTERS[@]}" --only --concurrency=4 --force --log-order=stream || status=$?
          fi
          echo "PASS1_EXIT=$status" >> "$GITHUB_ENV"
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::warning::Pass 1 ran out of the job's time (exit $status) before it finished."
            echo "::warning::That is a capacity reading, not a suite reading; the verdict step"
            echo "::warning::reports it as INCOMPLETE and will fail this job."
          elif [ "$status" -ne 0 ]; then
            echo "::warning::Pass 1 exited $status — the suite is red on main. Recorded as the"
            echo "::warning::BASELINE and NOT failed here: pass 2 runs anyway so the rerun"
            echo "::warning::property still gets measured tonight. The verdict step owns the"
            echo "::warning::job's exit status and will still fail this job."
          fi

      # Informational only. A stray `.objectstack/` is how the #4065 class shows
      # up on disk, so printing what pass 1 left behind turns a pass-2 failure
      # from "something is flaky" into a named file to go look at. Some entries
      # here are legitimate (an example app's own project directory), which is
      # why this reports rather than fails — pass 2 is the assertion.
      - name: Report on-disk state left by pass 1
        if: always()
        run: |
          echo "Directories named .objectstack under the checkout:"
          find . -path ./node_modules -prune -o -type d -name '.objectstack' -print || true
          echo
          echo "Files inside them:"
          find . -path ./node_modules -prune -o -type d -name '.objectstack' -exec find {} -type f \; || true

      # ⭐ `if: always()` is the other half of #18590 — pass 2 is the assertion,
      # so it runs whatever pass 1 did. A red pass 1 now costs this instrument
      # its BASELINE, not its reading.
      #
      # This step no longer renders the verdict either. It cannot: with a red
      # baseline allowed, "pass 2 failed" is no longer the same fact as
      # "rerun-unsafe" — a task that was already failing in pass 1 and fails
      # again in pass 2 is ordinary breakage on main, and printing the #4065
      # text over it would send whoever triages it hunting for state leaks that
      # are not there. That comparison needs both passes' failing task sets, so
      # it belongs one step down, in the verdict.
      #
      # Every step from here reads the plan step's outcome too: with no package
      # set there is nothing to run twice, and running `turbo run test` with no
      # --filter would test the whole workspace under this leg's name. The plan
      # step's own red is the reading on such a night.
      - name: Test suite — pass 2 (same working tree)
        if: always() && steps.plan.outcome == 'success'
        run: |
          # Bound vitest's INNER worker pool (#11958). A no-op on a runner with
          # <= 5 cores (it only ever LOWERS vitest's own `cores - 1` default);
          # it exists so a larger runner cannot multiply turbo's outer
          # --concurrency by a host-sized inner pool. Empty on failure, which is
          # vitest's own "use the default" signal. Needs turbo.json's
          # globalPassThroughEnv entry or turbo strips it — see the script header.
          export VITEST_MAX_WORKERS="$(node scripts/vitest-worker-cap.mjs)"
          # The same packages as pass 1, from the same file.
          mapfile -t PKGS < "$RUNNER_TEMP/leg-packages.txt"
          FILTERS=("${PKGS[@]/#/--filter=}")
          # Whatever pass 1 left of the job's time; see pass 1 for the bound.
          budget=$(( (JOB_DEADLINE_EPOCH - $(date +%s)) / 60 - PASS_RESERVE_MINUTES ))
          echo "Pass 2 of leg ${RERUN_LEG} may run ${budget} minutes before the job's own timeout would end it."
          status=0
          if [ "$budget" -lt 1 ]; then
            : > "$RUNNER_TEMP/rerun-pass2.log"
            status=124
          else
            node scripts/run-with-stall-guard.mjs --log "$RUNNER_TEMP/rerun-pass2.log" --stall-minutes 15 -- \
              timeout --kill-after=2m "${budget}m" \
              pnpm turbo run test "${FILTERS[@]}" --only --concurrency=4 --force --log-order=stream || status=$?
          fi
          echo "PASS2_EXIT=$status" >> "$GITHUB_ENV"

      # ⭐ THE VERDICT, and the job's exit status (#18590).
      #
      # It answers the question the exit code alone has never been able to
      # express — was the rerun property MEASURED tonight — and only then what
      # it measured. `scripts/rerun-safety-verdict.mjs` carries the table and a
      # `--self-test`; its header is the authority on detail.
      #
      # ⛔ This step does not make the job green. A red pass 1 still fails it,
      # exactly as before; what is new is that the failure now SAYS which of
      # "broken on main" and "rerun-unsafe" it is, and a broken-on-main night no
      # longer swallows the reading.
      # ⛔ The self-test is NOT invoked here. It runs at PR time as
      # `pnpm check:rerun-safety-verdict` in lint.yml, because this workflow
      # declares only `schedule` and `workflow_dispatch`: a gate family reachable
      # from here alone would be the tree's first SCHEDULED-ONLY family, which
      # `check:pm-dispatch-gates` refuses by name. That step's comment carries
      # the reasoning.
      #
      # `--leg` puts this leg's name in the verdict's header and in its error
      # annotation: four legs print four verdicts, and each covers only its own
      # packages.
      - name: Rerun-safety verdict
        if: always() && steps.plan.outcome == 'success'
        run: |
          node scripts/rerun-safety-verdict.mjs --leg "$RERUN_LEG" \
            --pass1-log "$RUNNER_TEMP/rerun-pass1.log" --pass1-exit "${PASS1_EXIT:-1}" \
            --pass2-log "$RUNNER_TEMP/rerun-pass2.log" --pass2-exit "${PASS2_EXIT:-1}"
